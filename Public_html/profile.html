<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Roomi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <style>
        /* Crop Modal */
        .crop-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .crop-modal-overlay.active { display: flex; }
        .crop-modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 420px;
            max-width: 95vw;
        }
        .crop-modal h3 { margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 700; color: #1f2937; }
        .crop-container {
            width: 100%;
            height: 320px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
        }
        .crop-container img { max-width: 100%; display: block; }
        .crop-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .btn-crop-cancel {
            background: #f3f4f6; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer; color: #1f2937;
        }
        .btn-crop-save {
            background: #CE1141; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer; color: white;
        }
        .crop-hint { font-size: 0.78rem; color: #9ca3af; margin-top: 10px; text-align: center; }
        /* Make crop box circular */
        .cropper-view-box,
        .cropper-face {
            border-radius: 50%;
        }
    </style>
    <style>
        .hobby-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .hobby-tag {
            background: #fef2f2;
            color: #CE1141;
            border: 1px solid #fecaca;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hobby-tag button {
            background: none;
            border: none;
            color: #CE1141;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            line-height: 1;
        }
        .hobby-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .hobby-input-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .hobby-input-row input:focus { border-color: #CE1141; }
        .btn-add-hobby {
            background: #CE1141;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .year-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1f2937;
            outline: none;
            background: white;
        }
        .year-select:focus { border-color: #CE1141; }
        .bio-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1f2937;
            outline: none;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .bio-textarea:focus { border-color: #CE1141; }
        .char-count { font-size: 0.75rem; color: #9ca3af; text-align: right; margin-top: 4px; }
        .profile-pic-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fecaca;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar-embark">
        <div class="nav-container-embark">
            <div class="nav-brand-embark">
                <span style="color: #CE1141; font-weight: 700; font-size: 24px;">Roomi</span>
            </div>
            <div class="nav-links-embark">
                <a href="dashboard.html" class="nav-link-embark">Home</a>
                <a href="matches.html" class="nav-link-embark">Matches</a>
                <a href="profile.html" class="nav-link-embark active">Profile</a>
                <a href="admin.html" class="nav-link-embark" id="adminLink" style="display:none; color:#CE1141; font-weight:600;">Admin</a>
            </div>
            <div class="nav-actions-embark">
                <button class="btn-text-embark" id="logoutBtn">Log out</button>
            </div>
        </div>
    </nav>

    <div class="profile-content-embark">
        <div class="container-embark">
            <div id="alert" class="alert hidden"></div>

            <div class="profile-grid-two-col">

                <!-- Left Column -->
                <div class="profile-left-col">

                    <!-- Profile Card -->
                    <div class="profile-card-embark">
                        <div class="profile-avatar-section">
                            <input type="file" id="profilePicture" accept="image/*" style="display:none;">
                            <div class="profile-avatar" id="avatarContainer" onclick="document.getElementById('profilePicture').click()" style="cursor:pointer; position:relative;" title="Click to change photo">
                                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <button type="button" onclick="document.getElementById('profilePicture').click()" style="background:none; border:none; color:#CE1141; font-size:0.8rem; font-weight:600; cursor:pointer; margin-top:6px;">Change Photo</button>
                            <h2 class="profile-name" id="displayName">...</h2>
                            <p class="profile-email-display" id="emailDisplay">...</p>
                        </div>
                        <div class="profile-stats">
                            <div class="stat-item">
                                <span class="stat-label">Year</span>
                                <span class="stat-value" id="yearDisplay">—</span>
                            </div>
                            <div class="stat-item" style="margin-top:12px">
                                <span class="stat-label">Major</span>
                                <span class="stat-value" id="majorDisplay">—</span>
                            </div>
                            <div class="stat-item" style="margin-top:12px">
                                <span class="stat-label">Member Since</span>
                                <span class="stat-value" id="memberSince">...</span>
                            </div>
                        </div>
                    </div>


                </div>

                <!-- Right Column -->
                <div class="profile-right-col">

                    <!-- Edit Profile Card -->
                    <div class="profile-card-embark">
                        <h3 class="card-heading">Edit Profile</h3>
                        <form id="profileForm">

                            <!-- Year -->
                            <div class="form-group">
                                <label>Year in School <span style="color:#CE1141">*</span></label>
                                <select class="year-select" id="yearSelect" required>
                                    <option value="">Select your year</option>
                                    <option value="Freshman">Freshman</option>
                                    <option value="Sophomore">Sophomore</option>
                                    <option value="Junior">Junior</option>
                                    <option value="Senior">Senior</option>
                                    <option value="Graduate">Graduate</option>
                                </select>
                                <span class="error-message" id="yearError"></span>
                            </div>

                            <!-- Major -->
                            <div class="form-group">
                                <label>Major <span style="color:#CE1141">*</span></label>
                                <input type="text" class="year-select" id="majorInput" placeholder="e.g., Computer Science, Biology..." maxlength="100" required>
                                <span class="error-message" id="majorError"></span>
                            </div>

                            <!-- Bio -->
                            <div class="form-group">
                                <label>About Me <span style="color:#CE1141">*</span></label>
                                <textarea class="bio-textarea" id="bio" maxlength="500" placeholder="Tell potential roommates a bit about yourself..."></textarea>
                                <div class="char-count"><span id="bioCount">0</span>/500</div>
                                <span class="error-message" id="bioError"></span>
                            </div>

                            <!-- Hobbies -->
                            <div class="form-group">
                                <label>Hobbies <span style="color:#CE1141">*</span></label>
                                <div class="hobby-tags" id="hobbyTags"></div>
                                <div class="hobby-input-row">
                                    <input type="text" id="hobbyInput" placeholder="Add a hobby (e.g. Gaming, Hiking...)" maxlength="30">
                                    <button type="button" class="btn-add-hobby" onclick="addHobby()">Add</button>
                                </div>
                                <span class="error-message" id="hobbiesError"></span>
                            </div>


                            <button type="submit" class="btn-primary-embark" style="width:100%; margin-top:8px;">
                                Save Profile
                            </button>
                        </form>
                    </div>

                    <!-- Change Password Card -->
                    <div class="profile-card-embark">
                        <h3 class="card-heading">Change Password</h3>
                        <form id="passwordForm" class="password-form-embark">
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="password-input">
                                    <input type="password" id="currentPassword" placeholder="Enter current password">
                                    <button type="button" class="toggle-password" onclick="togglePasswordField('currentPassword', this)">
                                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="password-input">
                                    <input type="password" id="newPassword" placeholder="8+ characters" minlength="8">
                                    <button type="button" class="toggle-password" onclick="togglePasswordField('newPassword', this)">
                                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="password-input">
                                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password" minlength="8">
                                    <button type="button" class="toggle-password" onclick="togglePasswordField('confirmNewPassword', this)">
                                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                                <span class="error-message" id="confirmNewPasswordError"></span>
                            </div>
                            <button type="submit" class="btn-primary-embark">
                                Update Password
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Crop Modal -->
    <div class="crop-modal-overlay" id="cropModal">
        <div class="crop-modal">
            <h3>Crop Profile Photo</h3>
            <!-- Image + Right slider -->
            <div style="display:flex; gap:12px; align-items:stretch;">
                <div class="crop-container" style="flex:1;">
                    <img id="cropImage" src="" alt="Crop">
                </div>
                <!-- Up/Down slider (vertical, right of image) -->
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; background:#f3f4f6; border-radius:10px; padding:10px 8px; gap:8px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
                    <input type="range" id="sliderY" min="-200" max="200" value="0"
                        style="writing-mode:vertical-lr; direction:rtl; height:200px; accent-color:#CE1141; cursor:pointer;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- Bottom controls -->
            <div style="background:#f3f4f6; border-radius:10px; padding:12px 14px; margin-top:10px; display:flex; flex-direction:column; gap:10px;">
                <!-- Left/Right -->
                <div style="display:flex; align-items:center; gap:10px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                    <input type="range" id="sliderX" min="-200" max="200" value="0" style="flex:1; accent-color:#CE1141; cursor:pointer;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
                <!-- Zoom -->
                <div style="display:flex; align-items:center; gap:10px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    <input type="range" id="sliderZoom" min="0" max="2" step="0.01" value="0" style="flex:1; accent-color:#CE1141; cursor:pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </div>
            </div>
            <p class="crop-hint" style="color:#9ca3af; margin-top:8px;">Drag · Scroll · Use controls to adjust</p>
            <div class="crop-actions">
                <button class="btn-crop-cancel" id="cropCancel">Cancel</button>
                <button class="btn-crop-save" id="cropSave">Save Photo</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth();

        // Check if user is admin and show admin link
        async function checkAdminStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/check`, {
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.is_admin) {
                    document.getElementById('adminLink').style.display = 'block';
                }
            } catch (err) {
                // Not admin or error - keep link hidden
            }
        }
        checkAdminStatus();

        let hobbies = [];

        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE}/api/profile`, {
                    credentials: 'include'
                });

                if (!res.ok) { window.location.href = 'login_improved.html'; return; }

                const { user } = await res.json();

                // Basic info
                const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.email.split('@')[0];
                document.getElementById('displayName').textContent = fullName;
                document.getElementById('emailDisplay').textContent = user.email;
                document.getElementById('memberSince').textContent = new Date(user.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                // Profile fields
                if (user.year_in_school) {
                    document.getElementById('yearSelect').value = user.year_in_school;
                    document.getElementById('yearDisplay').textContent = user.year_in_school;
                }
                if (user.major) {
                    document.getElementById('majorInput').value = user.major;
                    document.getElementById('majorDisplay').textContent = user.major;
                }
                if (user.bio) {
                    document.getElementById('bio').value = user.bio;
                    document.getElementById('bioCount').textContent = user.bio.length;
                }
                if (user.hobbies) {
                    hobbies = user.hobbies.split(',').map(h => h.trim()).filter(Boolean);
                    renderHobbies();
                }
                if (user.profile_picture) {
                    showProfilePic(user.profile_picture);
                }

            } catch (err) {
                console.error('Error loading profile:', err);
            }
        }

        function addHobby() {
            const input = document.getElementById('hobbyInput');
            const val = input.value.trim();
            if (!val || hobbies.includes(val) || hobbies.length >= 10) return;
            hobbies.push(val);
            input.value = '';
            renderHobbies();
        }

        function removeHobby(i) {
            hobbies.splice(i, 1);
            renderHobbies();
        }

        function renderHobbies() {
            document.getElementById('hobbyTags').innerHTML = hobbies.map((h, i) =>
                `<span class="hobby-tag">${h}<button onclick="removeHobby(${i})">×</button></span>`
            ).join('');
        }

        function showProfilePic(url) {
            const container = document.getElementById('avatarContainer');
            container.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="">`;
        }

        // Cropper setup
        let cropper = null;
        let croppedBlob = null;

        document.getElementById('profilePicture').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const cropImg = document.getElementById('cropImage');
                cropImg.src = e.target.result;

                // Destroy old cropper if exists
                if (cropper) { cropper.destroy(); cropper = null; }

                document.getElementById('cropModal').classList.add('active');

                // Init cropper after image loads
                cropImg.onload = function() {
                    cropper = new Cropper(cropImg, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 1,
                        restore: false,
                        guides: false,
                        center: false,
                        highlight: false,
                        cropBoxMovable: false,
                        cropBoxResizable: false,
                        toggleDragModeOnDblclick: false,
                        ready: function() {
                            document.getElementById('sliderX').value = 0;
                            document.getElementById('sliderY').value = 0;
                            document.getElementById('sliderZoom').value = 0;
                            document.getElementById('sliderX').dataset.prev = 0;
                            document.getElementById('sliderY').dataset.prev = 0;
                            document.getElementById('sliderZoom').dataset.prev = 0;
                        },
                        zoom: function(e) {
                            // Sync zoom slider when scrolling
                            const zoomSlider = document.getElementById('sliderZoom');
                            const currentZoom = parseFloat(zoomSlider.dataset.prev || 0);
                            const newZoom = Math.min(2, Math.max(0, currentZoom + e.detail.ratio - e.detail.oldRatio));
                            zoomSlider.value = newZoom;
                            zoomSlider.dataset.prev = newZoom;
                        },
                        cropend: function() {
                            // Sync X/Y sliders when dragging stops
                            syncPositionSliders();
                        },
                        cropmove: function() {
                            // Sync X/Y sliders while dragging
                            syncPositionSliders();
                        }
                    });
                };

                function syncPositionSliders() {
                    if (!cropper) return;
                    const canvas = cropper.getCanvasData();
                    const crop = cropper.getCropBoxData();
                    const offsetX = Math.round(canvas.left - (crop.left + crop.width / 2 - canvas.width / 2));
                    const offsetY = Math.round(canvas.top - (crop.top + crop.height / 2 - canvas.height / 2));
                    const sliderX = document.getElementById('sliderX');
                    const sliderY = document.getElementById('sliderY');
                    sliderX.value = Math.min(200, Math.max(-200, offsetX));
                    sliderX.dataset.prev = sliderX.value;
                    sliderY.value = Math.min(200, Math.max(-200, offsetY));
                    sliderY.dataset.prev = sliderY.value;
                }
            };
            reader.readAsDataURL(file);
        });

        // D-pad nudge
        function nudge(dx, dy) {
            if (!cropper) return;
            const data = cropper.getCanvasData();
            cropper.setCanvasData({ left: data.left + dx, top: data.top + dy });
            syncPositionSliders();
        }

        // Slider controls
        document.getElementById('sliderX').addEventListener('input', function() {
            if (!cropper) return;
            const data = cropper.getCanvasData();
            cropper.setCanvasData({ left: data.left + parseInt(this.value) - parseInt(this.dataset.prev || 0) });
            this.dataset.prev = this.value;
        });

        document.getElementById('sliderY').addEventListener('input', function() {
            if (!cropper) return;
            const data = cropper.getCanvasData();
            cropper.setCanvasData({ top: data.top + parseInt(this.value) - parseInt(this.dataset.prev || 0) });
            this.dataset.prev = this.value;
        });

        document.getElementById('sliderZoom').addEventListener('input', function() {
            if (!cropper) return;
            const val = parseFloat(this.value);
            const prev = parseFloat(this.dataset.prev || 0);
            cropper.zoom(val - prev);
            this.dataset.prev = val;
        });

        document.getElementById('cropCancel').addEventListener('click', function() {
            document.getElementById('cropModal').classList.remove('active');
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('profilePicture').value = '';
        });

        document.getElementById('cropSave').addEventListener('click', function() {
            if (!cropper) return;
            cropper.getCroppedCanvas({ width: 400, height: 400 }).toBlob(function(blob) {
                croppedBlob = blob;
                const url = URL.createObjectURL(blob);
                showProfilePic(url);
                document.getElementById('cropModal').classList.remove('active');
                cropper.destroy();
                cropper = null;
            }, 'image/jpeg', 0.9);
        });

        // Allow Enter key to add hobby
        document.getElementById('hobbyInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); addHobby(); }
        });

        // Bio character count
        document.getElementById('bio').addEventListener('input', function() {
            document.getElementById('bioCount').textContent = this.value.length;
        });

        // Save profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const year = document.getElementById('yearSelect').value;
            const major = document.getElementById('majorInput').value.trim();
            const bio = document.getElementById('bio').value.trim();
            const picture = document.getElementById('profilePicture').value.trim();

            // Clear errors
            document.getElementById('yearError').textContent = '';
            document.getElementById('majorError').textContent = '';
            document.getElementById('bioError').textContent = '';
            document.getElementById('hobbiesError').textContent = '';

            let valid = true;
            if (!year) { document.getElementById('yearError').textContent = 'Please select your year'; valid = false; }
            if (!major) { document.getElementById('majorError').textContent = 'Please enter your major'; valid = false; }
            if (!bio) { document.getElementById('bioError').textContent = 'Please write a short bio'; valid = false; }
            if (hobbies.length === 0) { document.getElementById('hobbiesError').textContent = 'Please add at least one hobby'; valid = false; }
            if (!valid) return;

            setLoading(true);

            try {
                // Upload cropped profile picture if one was selected
                if (croppedBlob) {
                    const formData = new FormData();
                    formData.append('file', croppedBlob, 'profile.jpg');

                    const uploadRes = await fetch(`${API_BASE}/api/upload-profile-picture`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });

                    if (!uploadRes.ok) {
                        const uploadData = await uploadRes.json();
                        showAlert(uploadData.message || 'Failed to upload image', 'error');
                        setLoading(false);
                        return;
                    }
                }

                // Save profile text fields
                const res = await fetch(`${API_BASE}/api/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        bio,
                        hobbies: hobbies.join(', '),
                        year_in_school: year,
                        major: major
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('Profile saved successfully!', 'success');
                    document.getElementById('yearDisplay').textContent = year;
                    document.getElementById('majorDisplay').textContent = major;
                    croppedBlob = null;
                } else {
                    showAlert(data.message || 'Failed to save profile', 'error');
                }
            } catch (err) {
                showAlert('Unable to connect to server.', 'error');
            } finally {
                setLoading(false);
            }
        });

        // Password change
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            document.getElementById('confirmNewPasswordError').textContent = '';

            if (!currentPassword) {
                showAlert('Please enter your current password', 'error');
                return;
            }

            if (newPassword !== confirmNewPassword) {
                document.getElementById('confirmNewPasswordError').textContent = 'Passwords do not match';
                return;
            }
            if (newPassword.length < 8) {
                document.getElementById('confirmNewPasswordError').textContent = 'Password must be at least 8 characters';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('Password changed successfully!', 'success');
                    document.getElementById('passwordForm').reset();
                } else {
                    showAlert(data.error || 'Failed to change password', 'error');
                }
            } catch (err) {
                showAlert('Unable to connect to server.', 'error');
            }
        });

        function togglePasswordField(fieldId, button) {
            const input = document.getElementById(fieldId);
            input.type = input.type === 'password' ? 'text' : 'password';
            button.classList.toggle('active');
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadProfile();
    </script>
</body>
</html>
