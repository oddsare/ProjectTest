<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Roomi</title>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #CE1141;
            margin: 0 0 4px 0;
        }
        .auth-logo p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 0;
        }
        .auth-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 6px 0;
        }
        .auth-card .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 0 0 28px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1f2937;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #CE1141; }
        .error-message { font-size: 0.78rem; color: #ef4444; margin-top: 4px; display: block; }
        .btn-submit {
            width: 100%;
            background: #CE1141;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 0.03em;
            margin-top: 4px;
        }
        .btn-submit:hover { background: #a00d31; }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.88rem;
            color: #CE1141;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            font-weight: 500;
        }
        .alert.error { background: #fef2f2; color: #dc2626; }
        .alert.success { background: #f0fdf4; color: #16a34a; }
        .alert.hidden { display: none; }
        .success-box {
            text-align: center;
            padding: 16px 0;
        }
        .success-box p {
            color: #16a34a;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .spinner { display: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <h1>Roomi</h1>
            <p>Ole Miss Roommate Matching</p>
        </div>

        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new password below</p>

        <div id="alert" class="alert hidden"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your new password" required>
                <span class="error-message" id="confirmError"></span>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">RESET PASSWORD</span>
                <span class="spinner"></span>
            </button>

            <a href="login_improved.html" class="back-link">← Back to login</a>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            showAlert('Invalid or missing reset link. Please request a new one.', 'error');
            document.getElementById('resetPasswordForm').style.display = 'none';
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmError').textContent = '';
            hideAlert();

            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                return;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmError').textContent = 'Passwords do not match';
                return;
            }

            setLoading(true);

            try {
                const response = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();
                setLoading(false);

                if (response.ok) {
                    document.getElementById('resetPasswordForm').innerHTML = `
                        <div class="success-box">
                            <p>Password reset successfully!</p>
                            <a href="login_improved.html" class="btn-submit" style="display:inline-block; text-decoration:none; padding: 13px 32px; width:auto;">Go to Login</a>
                        </div>
                    `;
                } else {
                    showAlert(data.error || data.message || 'Reset failed. The link may have expired.', 'error');
                }

            } catch (error) {
                setLoading(false);
                showAlert('Unable to connect to server. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
